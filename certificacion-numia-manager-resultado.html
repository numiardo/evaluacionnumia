function isValidEmail(s) {
  s = (s || '').trim();
  if (s.length < 5) return false;
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
}

function isNonEmptyName(s) {
  s = (s || '').trim();
  if (s.length < 2 || s.length > 80) return false;
  return /^[\p{L}\s'.-]+$/u.test(s);
}

function isValidCorporatePhone(s) {
  const d = String(s || '').replace(/\D/g, '');
  return d.length >= 8 && d.length <= 15;
}

function readPartnerProfileFromStorage() {
  try {
    const raw = sessionStorage.getItem(PARTNER_PROFILE_KEY);
    if (!raw) return null;
    const o = JSON.parse(raw);
    if (!o || typeof o !== 'object') return null;
    return {
      email: String(o.email || '').trim(),
      nombre: String(o.nombre || '').trim(),
      apellido: String(o.apellido || '').trim(),
      cel: String(o.cel || '').trim(),
    };
  } catch (e) {
    return null;
  }
}

function isPartnerProfileComplete(p) {
  return !!(p && isValidEmail(p.email) && isNonEmptyName(p.nombre) && isNonEmptyName(p.apellido) && isValidCorporatePhone(p.cel));
}

async function registerResultInNocodb(partner, puntuacion) {
  const res = await fetch(NOCO_API_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'xc-token': NOCO_XC_TOKEN,
    },
    body: JSON.stringify({
      Email: partner.email.trim(),
      Puntuacion: puntuacion,
      Nombre: partner.nombre.trim(),
      Apellido: partner.apellido.trim(),
      CelEmpresarial: partner.cel.trim(),
    }),
  });
  if (!res.ok) {
    const t = await res.text();
    throw new Error(t || res.statusText);
  }
  return res.json().catch(function () { return null; });
}

function loadAnswersFromStorage() {
  try {
    const raw = sessionStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!Array.isArray(data) || data.length !== questions.length) return null;
    return data.map((arr) => {
      if (!Array.isArray(arr)) return new Set();
      return new Set(arr);
    });
  } catch (e) {
    return null;
  }
}

function scoreExam(userSets) {
  let totalScore = 0, nCorrect = 0, nIncorrect = 0, nPartial = 0;
  const results = questions.map((q, qi) => {
    const userSet = userSets[qi];
    const correctSet = new Set(q.correct);
    const uArr = [...userSet].sort((a, b) => a - b);
    const cArr = [...correctSet].sort((a, b) => a - b);
    const isExact = uArr.length === cArr.length && uArr.every((v, i) => v === cArr[i]);
    let status, pts = 0;
    if (q.type === 'single') {
      if (isExact) { status = 'correct'; pts = q.pts; nCorrect++; }
      else { status = 'incorrect'; nIncorrect++; }
    } else {
      if (isExact) { status = 'correct'; pts = q.pts; nCorrect++; }
      else {
        const hits = [...userSet].filter((i) => correctSet.has(i)).length;
        const wrongs = [...userSet].filter((i) => !correctSet.has(i)).length;
        const net = Math.max(0, hits - wrongs);
        if (net > 0) { status = 'partial'; pts = Math.round(q.pts * net / cArr.length); nPartial++; }
        else { status = 'incorrect'; nIncorrect++; }
      }
    }
    totalScore += pts;
    return { q, status, pts, userSet, correctSet };
  });
  const maxPoints = questions.reduce((s, q) => s + q.pts, 0);
  return { totalScore, nCorrect, nIncorrect, nPartial, results, maxPoints, passed: totalScore >= Math.ceil(maxPoints * 0.75) };
}

let lastPdfContext = { totalScore: 0, maxPoints: 100, passed: false, nCorrect: 0, nTotal: 0, email: '', nombre: '', apellido: '', cel: '' };

function buildPdf() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();

  const C = {
    black: [6, 10, 39],
    purple: [134, 61, 255],
    purpleDark: [90, 40, 200],
    turquoise: [123, 225, 201],
    grey: [100, 100, 118],
    muted: [130, 128, 145],
    white: [255, 255, 255],
    paper: [244, 244, 250],
    line: [225, 223, 235],
    failFill: [252, 228, 228],
    failText: [90, 28, 28],
    okFill: [210, 248, 238],
    okText: [12, 72, 58],
  };

  const passed = !!lastPdfContext.passed;
  const nc = lastPdfContext.nCorrect != null ? lastPdfContext.nCorrect : 0;
  const nt = lastPdfContext.nTotal != null ? lastPdfContext.nTotal : 0;
  const nombreCompleto = [lastPdfContext.nombre, lastPdfContext.apellido].filter(Boolean).join(' ').trim() || '—';

  doc.setFillColor.apply(doc, C.paper);
  doc.rect(0, 0, pageW, pageH, 'F');

  doc.setFillColor.apply(doc, C.black);
  doc.rect(0, 0, pageW, 34, 'F');
  doc.setFillColor.apply(doc, C.purple);
  doc.rect(0, 34, pageW, 2.2, 'F');

  doc.setTextColor.apply(doc, C.white);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(17);
  doc.text('Certificación Numia Manager', pageW / 2, 16, { align: 'center' });
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8.5);
  doc.setTextColor(188, 186, 220);
  doc.text('Comprobante de evaluación', pageW / 2, 26, { align: 'center' });

  const mx = 18;
  const cw = pageW - mx * 2;
  const cardY = 46;
  const cardH = 102;

  doc.setDrawColor.apply(doc, C.line);
  doc.setLineWidth(0.35);
  doc.setFillColor(255, 255, 255);
  doc.roundedRect(mx, cardY, cw, cardH, 4, 4, 'FD');

  const ix = mx + 11;
  let cy = cardY + 14;

  doc.setTextColor.apply(doc, C.muted);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(7.5);
  doc.text('PARTICIPANTE', ix, cy);
  cy += 6;
  doc.setTextColor.apply(doc, C.black);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(14);
  doc.splitTextToSize(nombreCompleto, cw - 22).forEach(function (line) {
    doc.text(line, ix, cy);
    cy += 6.5;
  });
  cy += 6;

  doc.setDrawColor.apply(doc, C.line);
  doc.setLineWidth(0.2);
  doc.line(ix, cy, mx + cw - 11, cy);
  cy += 10;

  doc.setTextColor.apply(doc, C.muted);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(7.5);
  doc.text('CALIFICACIÓN (ACERTADAS / TOTAL)', ix, cy);
  cy += 12;
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(36);
  doc.setTextColor.apply(doc, C.purple);
  doc.text(nc + '/' + nt, ix, cy);
  cy += 14;

  doc.setDrawColor.apply(doc, C.purple);
  doc.setLineWidth(0.6);
  doc.line(ix, cy, ix + 42, cy);
  cy += 12;

  doc.setTextColor.apply(doc, C.muted);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(7.5);
  doc.text('ESTADO', ix, cy);
  cy += 7;
  const estadoTxt = passed ? 'Aprobado' : 'No aprobado';
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(10);
  const tw = doc.getTextWidth(estadoTxt);
  const pillW = tw + 14;
  const pillH = 9;
  const pillX = mx + (cw - pillW) / 2;
  if (passed) {
    doc.setFillColor.apply(doc, C.okFill);
    doc.setDrawColor(100, 210, 185);
  } else {
    doc.setFillColor.apply(doc, C.failFill);
    doc.setDrawColor(230, 160, 160);
  }
  doc.setLineWidth(0.25);
  doc.roundedRect(pillX, cy - 5.2, pillW, pillH, 2.2, 2.2, 'FD');
  doc.setTextColor.apply(doc, passed ? C.okText : C.failText);
  doc.text(estadoTxt, pillX + pillW / 2, cy + 1.2, { align: 'center' });
  cy += 18;

  const d = new Date();
  const fecha = d.toLocaleString('es-MX', { dateStyle: 'long', timeStyle: 'short' });
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8);
  doc.setTextColor.apply(doc, C.grey);
  doc.text('Documento generado el ' + fecha, pageW / 2, cardY + cardH - 8, { align: 'center' });

  const fh = 13;
  doc.setFillColor.apply(doc, C.black);
  doc.rect(0, pageH - fh, pageW, fh, 'F');
  doc.setTextColor(150, 148, 168);
  doc.setFontSize(7.5);
  doc.setFont('helvetica', 'normal');
  doc.text('Numia · Certificación Partners · Información confidencial', pageW / 2, pageH - fh / 2 + 1.2, { align: 'center' });

  doc.save('resultado-certificacion-numia-manager.pdf');
}

function render(resultsState) {
  const { totalScore, passed, maxPoints, nCorrect } = resultsState;
  const maxP = maxPoints != null ? maxPoints : 100;
  const nTotal = questions.length;
  const gradeEl = document.getElementById('res-grade');
  if (gradeEl) gradeEl.textContent = nCorrect + '/' + nTotal;
  const badge = document.getElementById('res-badge');
  badge.textContent = passed ? 'Aprobado' : 'No aprobado';
  badge.className = 'results-badge ' + (passed ? 'badge-aprobado' : 'badge-reprobado');

  lastPdfContext = {
    totalScore, maxPoints: maxP, passed, nCorrect, nTotal,
    email: lastPdfContext.email, nombre: lastPdfContext.nombre, apellido: lastPdfContext.apellido, cel: lastPdfContext.cel,
  };

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function init() {
  const userSets = loadAnswersFromStorage();
  const partner = readPartnerProfileFromStorage();
  if (!userSets) {
    document.getElementById('err-screen').style.display = 'block';
    return;
  }
  if (!isPartnerProfileComplete(partner)) {
    document.getElementById('err-screen').querySelector('p').textContent =
      'Faltan datos del partner. Vuelve al examen, completa correo, nombre, apellido y celular empresarial, y envía de nuevo la evaluación.';
    document.getElementById('err-screen').style.display = 'block';
    return;
  }
  const state = scoreExam(userSets);
  document.getElementById('results-wrap').style.display = 'block';
  document.getElementById('res-partner-block').style.display = 'block';
  document.getElementById('res-partner-name').textContent = [partner.nombre, partner.apellido].filter(Boolean).join(' ').trim() || '—';
  lastPdfContext.email = partner.email;
  lastPdfContext.nombre = partner.nombre;
  lastPdfContext.apellido = partner.apellido;
  lastPdfContext.cel = partner.cel;
  render(state);

  const apiLine = document.getElementById('res-api-line');
  registerResultInNocodb(partner, state.totalScore)
    .then(function () {
      apiLine.className = 'res-api-line ok';
      apiLine.textContent = 'Resultado registrado correctamente';
    })
    .catch(function (err) {
      apiLine.className = 'res-api-line warn';
      var m = (err && err.message) ? err.message : 'Error de red, CORS o autenticación';
      if (m.length > 200) m = m.slice(0, 200) + '…';
      apiLine.textContent = 'No se pudo registrar en el servidor. ' + m;
    });

  document.getElementById('btn-pdf').addEventListener('click', function () {
    buildPdf();
  });
}

init();
